<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Class Clock</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <header class="header">

            <div class="logo">
                CLASS CLOCK
            </div>

            <div class="status">
                <span class="status-dot"></span>
                ONLINE
            </div>

        </header>


        <section class="hero">

            <p id="status">
                TIME LEFT BEFORE:
            </p>

            <h1 id="event">
                Loading...
            </h1>

            <div id="countdown">
                00:00:00
            </div>

            <p id="schedule"></p>

        </section>


        <div class="divider"></div>


        <section class="schedule-section">

            <div class="section-title">
                WEEKLY SCHEDULE
            </div>

            <div id="schedule-list">
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
